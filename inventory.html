<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Inventory - Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-emerald-50 via-teal-50/50 to-slate-100 text-slate-800 min-h-screen flex flex-col font-['Plus_Jakarta_Sans',sans-serif] selection:bg-emerald-600 selection:text-white">
    <div class="sticky top-0 z-50 px-4 sm:px-6 lg:px-8 pt-4">
        <header class="max-w-6xl mx-auto backdrop-blur-2xl bg-white/80 rounded-full border border-emerald-200/70 shadow-xl shadow-emerald-900/5 px-4 sm:px-6 py-2.5 flex items-center justify-between transition-all">
            <a href="index.html" class="flex items-center gap-3 group">
                <div class="flex items-center justify-center w-10 h-10 rounded-full bg-gradient-to-tr from-emerald-600 via-teal-500 to-green-500 font-extrabold text-white shadow-md shadow-emerald-600/25 group-hover:scale-105 transition-transform duration-300">
                    <i class="fa-solid fa-boxes-packing text-white text-base"></i>
                </div>
                <div>
                    <span class="font-extrabold text-lg text-slate-900 tracking-tight block leading-none group-hover:text-emerald-700 transition-colors">Smart Inventory</span>
                    <span class="text-[9px] font-extrabold text-emerald-600 tracking-widest uppercase block mt-0.5">Pantry Manager</span>
                </div>
            </a>

            <nav class="flex items-center gap-1.5">
                <a href="index.html" class="px-4 py-2 rounded-full font-semibold text-xs text-slate-600 hover:text-emerald-800 hover:bg-emerald-50/80 flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-house text-xs text-emerald-600"></i>
                    <span>Dashboard</span>
                </a>
                <a href="inventory.html" class="px-4 py-2 rounded-full font-extrabold text-xs bg-emerald-600 text-white shadow-md shadow-emerald-600/25 flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-boxes-stacked text-xs"></i>
                    <span>Inventory</span>
                </a>
                <a href="add-item.html" class="px-4 py-2 rounded-full font-semibold text-xs text-slate-600 hover:text-emerald-800 hover:bg-emerald-50/80 flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-plus text-xs text-emerald-600"></i>
                    <span>Add Item</span>
                </a>
            </nav>
        </header>
    </div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full space-y-6">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-black text-slate-900 tracking-tight">Pantry Inventory</h1>
                <p class="text-slate-500 text-sm mt-1">Manage, search, and update stock levels for all food items.</p>
            </div>
            <div class="flex items-center gap-2">
                <span id="items-count-badge" class="px-4 py-2 rounded-2xl bg-white/80 text-emerald-800 font-bold text-xs border border-emerald-200 shadow-sm">
                    0 Items Found
                </span>
            </div>
        </div>

        <div class="backdrop-blur-xl bg-white/70 rounded-3xl p-4 border border-emerald-100 shadow-xl shadow-emerald-900/5 flex flex-col md:flex-row gap-3">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass text-slate-400 absolute left-4 top-1/2 -translate-y-1/2 text-sm"></i>
                <input type="text" id="search-input" placeholder="Search food items by name..." 
                    class="w-full pl-11 pr-4 py-3 bg-white/90 border border-emerald-200/80 rounded-2xl text-sm font-medium text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all">
            </div>

            <div class="w-full md:w-56">
                <select id="category-filter" 
                    class="w-full px-4 py-3 bg-white/90 border border-emerald-200/80 rounded-2xl text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all">
                    <option value="ALL">All Categories</option>
                    <option value="Grains">Grains & Cereals</option>
                    <option value="Dairy">Dairy & Eggs</option>
                    <option value="Vegetables & Fruits">Vegetables & Fruits</option>
                    <option value="Meat">Meat & Seafood</option>
                    <option value="Beverages">Beverages</option>
                    <option value="Condiments">Condiments & Spices</option>
                    <option value="Bakery">Bakery & Snacks</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="w-full md:w-52">
                <select id="status-filter" 
                    class="w-full px-4 py-3 bg-white/90 border border-emerald-200/80 rounded-2xl text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all">
                    <option value="ALL">All Statuses</option>
                    <option value="LOW">Low Stock</option>
                    <option value="EXPIRING">Expiring Soon</option>
                    <option value="EXPIRED">Expired</option>
                    <option value="NORMAL">In Stock (Normal)</option>
                </select>
            </div>
        </div>

        <div id="inventory-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>

        <div id="empty-state" class="hidden backdrop-blur-xl bg-white/70 rounded-3xl border border-emerald-100 p-12 text-center space-y-4 shadow-xl">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-700 rounded-2xl flex items-center justify-center mx-auto shadow-inner">
                <i class="fa-solid fa-box-open text-2xl text-emerald-700"></i>
            </div>
            <div>
                <h3 class="text-lg font-extrabold text-slate-900">No Food Items Found</h3>
                <p class="text-sm text-slate-500 max-w-sm mx-auto mt-1 font-medium">No pantry items match your current search query or filter options.</p>
            </div>
            <button onclick="clearFilters()" class="px-5 py-2.5 rounded-2xl bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-bold text-xs transition-all">
                Clear All Filters
            </button>
        </div>
    </main>

    <footer class="backdrop-blur-xl bg-white/80 border-t border-emerald-200/60 py-6 text-center text-xs font-semibold text-slate-500 mt-auto">
        <p>Designed by Gaurika Pawade - CS25140</p>
    </footer>

    <script src="script.js"></script>
    <script>
        function renderInventory() {
            const pantry = getPantry();
            const searchVal = document.getElementById("search-input").value.trim().toLowerCase();
            const categoryVal = document.getElementById("category-filter").value;
            const statusVal = document.getElementById("status-filter").value;

            const filtered = pantry.filter(item => {
                const matchSearch = item.name.toLowerCase().includes(searchVal);
                const matchCategory = (categoryVal === "ALL") || (item.category === categoryVal);

                let matchStatus = true;
                if (statusVal === "LOW") {
                    matchStatus = isLowStock(item.quantity, item.minStock);
                } else if (statusVal === "EXPIRING") {
                    matchStatus = isExpiringSoon(item.expiry);
                } else if (statusVal === "EXPIRED") {
                    matchStatus = isExpired(item.expiry);
                } else if (statusVal === "NORMAL") {
                    matchStatus = !isLowStock(item.quantity, item.minStock) && !isExpiringSoon(item.expiry) && !isExpired(item.expiry);
                }

                return matchSearch && matchCategory && matchStatus;
            });

            document.getElementById("items-count-badge").textContent = `${filtered.length} Item${filtered.length === 1 ? '' : 's'} Found`;

            const grid = document.getElementById("inventory-grid");
            const emptyState = document.getElementById("empty-state");

            if (filtered.length === 0) {
                grid.innerHTML = "";
                emptyState.classList.remove("hidden");
                return;
            }

            emptyState.classList.add("hidden");

            let html = "";
            for (let i = 0; i < filtered.length; i++) {
                const item = filtered[i];
                
                const expired = isExpired(item.expiry);
                const expiringSoon = isExpiringSoon(item.expiry);
                const lowStock = isLowStock(item.quantity, item.minStock);

                let statusBadge = `<span class="px-3 py-1 rounded-full text-xs font-extrabold bg-emerald-100 text-emerald-800 border border-emerald-200">In Stock</span>`;
                let borderHighlight = "border-emerald-100";

                if (expired) {
                    statusBadge = `<span class="px-3 py-1 rounded-full text-xs font-extrabold bg-rose-100 text-rose-800 border border-rose-200 flex items-center gap-1">⚠️ Expired</span>`;
                    borderHighlight = "border-rose-200 bg-rose-50/20";
                } else if (expiringSoon) {
                    statusBadge = `<span class="px-3 py-1 rounded-full text-xs font-extrabold bg-orange-100 text-orange-800 border border-orange-200 flex items-center gap-1">⏰ Expiring Soon</span>`;
                    borderHighlight = "border-orange-200 bg-orange-50/20";
                } else if (lowStock) {
                    statusBadge = `<span class="px-3 py-1 rounded-full text-xs font-extrabold bg-amber-100 text-amber-800 border border-amber-200 flex items-center gap-1">📉 Low Stock</span>`;
                    borderHighlight = "border-amber-200 bg-amber-50/20";
                }

                html += `
                    <div class="backdrop-blur-xl bg-white/80 rounded-3xl p-6 border ${borderHighlight} shadow-xl shadow-emerald-900/5 hover:-translate-y-1 transition-all duration-300 flex flex-col justify-between space-y-5">
                        
                        <div class="space-y-3">
                            <div class="flex items-start justify-between gap-2">
                                <h3 class="font-black text-xl text-slate-900 leading-snug">${escapeHtml(item.name)}</h3>
                                ${statusBadge}
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="px-3 py-1 rounded-xl text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200/80">${escapeHtml(item.category)}</span>
                                <span class="text-xs text-slate-500 font-semibold">Min: ${item.minStock} ${escapeHtml(item.unit)}</span>
                            </div>
                        </div>

                        <div class="bg-slate-50/80 rounded-2xl p-4 flex items-center justify-between text-xs font-semibold border border-slate-200/60">
                            <div class="space-y-0.5">
                                <span class="text-slate-400 block text-[10px] uppercase font-extrabold tracking-wider">Expiry Date</span>
                                <span class="text-slate-900 font-bold">${formatDate(item.expiry)}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-slate-400 block text-[10px] uppercase font-extrabold tracking-wider">Days Left</span>
                                <span class="font-extrabold ${expired ? 'text-rose-600' : expiringSoon ? 'text-orange-600' : 'text-emerald-600'}">
                                    ${expired ? 'Expired' : getDaysRemaining(item.expiry) + ' days'}
                                </span>
                            </div>
                        </div>

                        <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
                            
                            <div class="flex items-center gap-1.5 bg-slate-100 p-1.5 rounded-2xl border border-slate-200">
                                <button onclick="onDecreaseQty(${item.id})" class="w-8 h-8 rounded-xl bg-white text-slate-700 hover:bg-slate-200 font-black text-lg active:scale-95 transition-all flex items-center justify-center shadow-sm">
                                    -
                                </button>
                                <span class="px-3 text-sm font-black text-slate-900 min-w-[2rem] text-center">
                                    ${item.quantity} <span class="text-xs font-normal text-slate-500">${escapeHtml(item.unit)}</span>
                                </span>
                                <button onclick="onIncreaseQty(${item.id})" class="w-8 h-8 rounded-xl bg-emerald-600 text-white hover:bg-emerald-700 font-black text-lg shadow-md active:scale-95 transition-all flex items-center justify-center">
                                    +
                                </button>
                            </div>

                            <div class="flex items-center gap-1">
                                <a href="add-item.html?edit=${item.id}" title="Edit Item" class="p-2.5 rounded-2xl text-slate-500 hover:text-emerald-600 hover:bg-emerald-50 transition-all">
                                    <i class="fa-solid fa-pen-to-square text-sm"></i>
                                </a>
                                <button onclick="onDeleteItem(${item.id})" title="Delete Item" class="p-2.5 rounded-2xl text-slate-500 hover:text-rose-600 hover:bg-rose-50 transition-all">
                                    <i class="fa-solid fa-trash-can text-sm"></i>
                                </button>
                            </div>

                        </div>

                    </div>
                `;
            }

            grid.innerHTML = html;
        }

        function onIncreaseQty(id) {
            const newQty = adjustQuantity(id, 1);
            if (newQty !== null) {
                renderInventory();
            }
        }

        function onDecreaseQty(id) {
            const newQty = adjustQuantity(id, -1);
            if (newQty !== null) {
                renderInventory();
            }
        }

        function onDeleteItem(id) {
            const pantry = getPantry();
            const item = pantry.find(i => i.id === Number(id));
            if (item && confirm(`Are you sure you want to delete "${item.name}" from your pantry?`)) {
                deleteFoodItem(id);
                renderInventory();
            }
        }

        function clearFilters() {
            document.getElementById("search-input").value = "";
            document.getElementById("category-filter").value = "ALL";
            document.getElementById("status-filter").value = "ALL";
            renderInventory();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("search-input").addEventListener("input", renderInventory);
            document.getElementById("category-filter").addEventListener("change", renderInventory);
            document.getElementById("status-filter").addEventListener("change", renderInventory);

            const urlParams = new URLSearchParams(window.location.search);
            const statusParam = urlParams.get('status');
            if (statusParam) {
                const statusSelect = document.getElementById("status-filter");
                if (statusSelect && statusSelect.querySelector(`option[value="${statusParam}"]`)) {
                    statusSelect.value = statusParam;
                }
            }

            renderInventory();
        });
    </script>
</body>
</html>
