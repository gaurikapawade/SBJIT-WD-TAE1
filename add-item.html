<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Inventory - Add Food Item</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-emerald-50 via-teal-50/50 to-slate-100 text-slate-800 min-h-screen flex flex-col font-['Plus_Jakarta_Sans',sans-serif] selection:bg-emerald-600 selection:text-white">
    <div class="sticky top-0 z-50 px-4 sm:px-6 lg:px-8 pt-4">
        <header class="max-w-6xl mx-auto backdrop-blur-2xl bg-white/80 rounded-full border border-emerald-200/70 shadow-xl shadow-emerald-900/5 px-4 sm:px-6 py-2.5 flex items-center justify-between transition-all">
            <a href="index.html" class="flex items-center gap-3 group">
                <div class="flex items-center justify-center w-10 h-10 rounded-full bg-gradient-to-tr from-emerald-600 via-teal-500 to-green-500 font-extrabold text-white shadow-md shadow-emerald-600/25 group-hover:scale-105 transition-transform duration-300">
                    <i class="fa-solid fa-boxes-packing text-white text-base"></i>
                </div>
                <div>
                    <span class="font-extrabold text-lg text-slate-900 tracking-tight block leading-none group-hover:text-emerald-700 transition-colors">Smart Inventory</span>
                    <span class="text-[9px] font-extrabold text-emerald-600 tracking-widest uppercase block mt-0.5">Pantry Manager</span>
                </div>
            </a>

            <nav class="flex items-center gap-1.5">
                <a href="index.html" class="px-4 py-2 rounded-full font-semibold text-xs text-slate-600 hover:text-emerald-800 hover:bg-emerald-50/80 flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-house text-xs text-emerald-600"></i>
                    <span>Dashboard</span>
                </a>
                <a href="inventory.html" class="px-4 py-2 rounded-full font-semibold text-xs text-slate-600 hover:text-emerald-800 hover:bg-emerald-50/80 flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-boxes-stacked text-xs text-emerald-600"></i>
                    <span>Inventory</span>
                </a>
                <a href="add-item.html" class="px-4 py-2 rounded-full font-extrabold text-xs bg-emerald-600 text-white shadow-md shadow-emerald-600/25 flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>Add Item</span>
                </a>
            </nav>
        </header>
    </div>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full space-y-6">
        <div class="text-center space-y-2">
            <h1 id="form-page-title" class="text-3xl font-black text-slate-900 tracking-tight">Add New Pantry Item</h1>
            <p id="form-page-subtitle" class="text-slate-500 text-sm">Enter the food item details below to save it into your local pantry inventory.</p>
        </div>

        <div class="backdrop-blur-xl bg-white/80 rounded-3xl p-6 sm:p-8 border border-emerald-100 shadow-xl shadow-emerald-900/5">
            <form id="add-item-form" class="space-y-6" novalidate>
                <input type="hidden" id="item-id">

                <div id="error-container" class="hidden rounded-2xl bg-rose-50 border border-rose-200 p-4 text-rose-800 text-sm space-y-1">
                    <div class="font-bold flex items-center gap-2 text-rose-900">
                        <i class="fa-solid fa-circle-exclamation text-rose-600 text-base"></i>
                        <span>Please correct the errors below:</span>
                    </div>
                    <ul id="error-list" class="list-disc list-inside text-xs text-rose-700 pl-2 space-y-0.5 font-medium">
                    </ul>
                </div>

                <div>
                    <label for="name" class="block text-xs font-extrabold uppercase tracking-wider text-slate-600 mb-2">
                        Food Item Name <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" id="name" placeholder="e.g. Basmati Rice, Whole Milk, Chicken Breast"
                        class="w-full px-4 py-3.5 bg-slate-50/80 border border-slate-200 rounded-2xl text-sm font-medium text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="category" class="block text-xs font-extrabold uppercase tracking-wider text-slate-600 mb-2">
                            Category <span class="text-rose-500">*</span>
                        </label>
                        <select id="category"
                            class="w-full px-4 py-3.5 bg-slate-50/80 border border-slate-200 rounded-2xl text-sm font-medium text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all">
                            <option value="">-- Select Category --</option>
                            <option value="Grains">Grains & Cereals</option>
                            <option value="Dairy">Dairy & Eggs</option>
                            <option value="Vegetables & Fruits">Vegetables & Fruits</option>
                            <option value="Meat">Meat & Seafood</option>
                            <option value="Beverages">Beverages</option>
                            <option value="Condiments">Condiments & Spices</option>
                            <option value="Bakery">Bakery & Snacks</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div>
                        <label for="unit" class="block text-xs font-extrabold uppercase tracking-wider text-slate-600 mb-2">
                            Measurement Unit <span class="text-rose-500">*</span>
                        </label>
                        <select id="unit"
                            class="w-full px-4 py-3.5 bg-slate-50/80 border border-slate-200 rounded-2xl text-sm font-medium text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all">
                            <option value="kg">Kilograms (kg)</option>
                            <option value="g">Grams (g)</option>
                            <option value="lbs">Pounds (lbs)</option>
                            <option value="oz">Ounces (oz)</option>
                            <option value="liters">Liters (L)</option>
                            <option value="ml">Milliliters (ml)</option>
                            <option value="pcs">Pieces / Items (pcs)</option>
                            <option value="packs">Packs / Boxes</option>
                            <option value="cans">Cans</option>
                            <option value="bottles">Bottles</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
